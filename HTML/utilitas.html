<div class="utilitas-container">
  <div class="utilitas-header" style="position: relative;">
    <h2>Utilitas & Data</h2>
    <p>Pusat modul operasional dan alat kelengkapan administrasi PMR.</p>
    
    <!-- Tombol Khusus Admin Tambah Link Aplikasi -->
    <button id="btn-tambah-link-app" onclick="window.openTambahLinkModal()" style="display: none; position: absolute; right: 0; top: 0; background: var(--maroon); color: white; border: none; padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; align-items: center; gap: 4px;">
      <i data-lucide="plus"></i> Tambah Link
    </button>
  </div>

  <!-- NAVIGASI 2 TAB UTAMA UTILITAS -->
  <div class="utilitas-tab-bar">
    <button class="util-tab-btn active" onclick="window.switchUtilitasSection('internal')">
      <i data-lucide="layout-grid"></i>
      <span>Aplikasi Terintegrasi</span>
    </button>
    <button class="util-tab-btn" onclick="window.switchUtilitasSection('tab-baru')">
      <i data-lucide="external-link"></i>
      <span>Modul Mandiri (Tab Baru)</span>
    </button>
  </div>

  <!-- ================= SEKSI 1: APLIKASI INTERNAL (BUKA LANGSUNG) ================= -->
  <section id="section-util-internal" class="util-pane active">
    <!-- Grid Ikon Aplikasi Internal -->
    <div class="app-grid" style="margin-bottom: 20px;">
      <!-- Kartu Kalender -->
      <div class="app-card" onclick="window.toggleAgendaViewer()">
        <div class="app-icon-wrapper" style="background-color: #fef2f2; color: var(--maroon);">
          <i data-lucide="calendar"></i>
        </div>
        <div class="app-title">Kalender & Agenda</div>
        <div class="app-badge badge-internal">BUKA</div>
      </div>

      <!-- Kartu Materi PMR -->
      <div class="app-card" onclick="window.toggleMateriViewer()">
        <div class="app-icon-wrapper" style="background-color: #eff6ff; color: #1d4ed8;">
          <i data-lucide="book-open"></i>
        </div>
        <div class="app-title">Materi PMR</div>
        <div class="app-badge badge-internal">BUKA</div>
      </div>
    </div>

    <!-- WADAH TEMPAT MEMUAT KALENDER SECARA DINAMIS -->
    <div id="agenda-viewer-wrapper" style="display: none;"></div>

    <!-- WADAH TEMPAT MEMUAT MATERI SECARA DINAMIS -->
    <div id="materi-viewer-wrapper" style="display: none;"></div>
  </section>

  <!-- ================= SEKSI 2: APLIKASI TAB BARU ================= -->
  <section id="section-util-tab-baru" class="util-pane">
    <div class="app-grid" id="utilitas-app-grid">
      <!-- Aplikasi tab baru dirender oleh utilitas.js -->
    </div>
  </section>
</div>

<!-- MODAL TAMBAH APLIKASI LINK -->
<div class="modal-backdrop" id="modal-tambah-link" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15,23,42,0.6); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 16px;">
  <div class="modal-card" style="background: white; width: 100%; max-width: 400px; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.2);">
    <div style="background: var(--maroon); color: white; padding: 14px 18px; display: flex; justify-content: space-between;">
      <h3 style="font-size: 14px; font-weight: 700;">Tambah Aplikasi (Link)</h3>
      <button onclick="window.closeTambahLinkModal()" style="background: none; border: none; color: white; font-size: 20px; cursor: pointer;">&times;</button>
    </div>
    <form id="form-tambah-link" onsubmit="window.handleTambahLinkSubmit(event)" style="padding: 16px 18px; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; flex-direction: column; gap: 5px;">
        <label style="font-size: 11px; font-weight: 600; color: #64748b;">Nama Aplikasi *</label>
        <input type="text" id="link-nama" placeholder="Contoh: Canva PMR" required style="padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 12px;" />
      </div>
      <div style="display: flex; flex-direction: column; gap: 5px;">
        <label style="font-size: 11px; font-weight: 600; color: #64748b;">URL Target (Link) *</label>
        <input type="url" id="link-url" placeholder="https://..." required style="padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 12px;" />
      </div>
      <div style="display: flex; flex-direction: column; gap: 5px;">
        <label style="font-size: 11px; font-weight: 600; color: #64748b;">Akses Minimal *</label>
        <select id="link-akses" required style="padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 12px;">
          <option value="guest">Semua Orang (Termasuk Guest)</option>
          <option value="anggota">Minimal Anggota</option>
          <option value="pengurus">Minimal Pengurus</option>
          <option value="admin">Khusus Admin</option>
        </select>
      </div>
      <div style="display: flex; flex-direction: column; gap: 5px;">
        <label style="font-size: 11px; font-weight: 600; color: #64748b;">Upload Ikon (Gambar JPG/PNG) *</label>
        <input type="file" id="link-ikon-file" accept="image/*" required style="font-size: 12px;" />
      </div>
      <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px;">
        <button type="button" onclick="window.closeTambahLinkModal()" style="padding: 8px 16px; border-radius: 8px; font-size: 12px; font-weight: 600; border: none; background: #e2e8f0; cursor: pointer;">Batal</button>
        <button type="submit" id="btn-save-link" style="padding: 8px 16px; border-radius: 8px; font-size: 12px; font-weight: 700; border: none; background: var(--maroon); color: white; cursor: pointer;">Simpan</button>
      </div>
    </form>
  </div>
</div>

<style>
